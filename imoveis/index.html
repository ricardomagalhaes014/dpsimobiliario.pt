<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imóveis Disponíveis | DPS Imobiliário</title>
  <meta name="description" content="Encontre o imóvel ideal com os nossos especialistas. Apartamentos e moradias disponíveis em Portugal.">
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #222; }

    /* HEADER */
    header {
      background: #1a1a2e;
      color: white;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
    .logo img { height: 36px; }
    .logo span { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
    .back-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 7px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: white;
      padding: 48px 24px 40px;
      text-align: center;
    }
    .hero h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .hero p { font-size: 1rem; opacity: 0.8; }

    /* FILTROS */
    .filters-bar {
      background: white;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      position: sticky;
      top: 64px;
      z-index: 90;
    }
    .filters-bar label { font-size: 0.8rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filters-bar select, .filters-bar input {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.9rem;
      background: #fafafa;
      color: #333;
      min-width: 140px;
    }
    .filters-bar select:focus, .filters-bar input:focus {
      outline: none;
      border-color: #0f3460;
    }
    .results-count {
      margin-left: auto;
      font-size: 0.85rem;
      color: #666;
      align-self: flex-end;
      padding-bottom: 4px;
    }
    .results-count strong { color: #0f3460; }

    /* GRID */
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* CARD */
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.14); }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #e0e0e0;
    }
    .card-img-placeholder {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #e0e0e0, #c8c8c8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #999;
    }

    .card-badges {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 6px;
    }
    .card-wrap { position: relative; }
    .badge {
      background: #0f3460;
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.tipo { background: #e94560; }

    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .card-title { font-size: 1rem; font-weight: 700; color: #1a1a2e; line-height: 1.3; }
    .card-location { font-size: 0.82rem; color: #888; display: flex; align-items: center; gap: 4px; }
    .card-features { display: flex; gap: 12px; font-size: 0.82rem; color: #555; flex-wrap: wrap; }
    .card-features span { display: flex; align-items: center; gap: 4px; }
    .card-price { font-size: 1.25rem; font-weight: 800; color: #0f3460; margin-top: auto; padding-top: 8px; }
    .card-agent {
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fafafa;
    }
    .agent-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }
    .agent-info { display: flex; flex-direction: column; }
    .agent-name { font-size: 0.82rem; font-weight: 600; color: #333; }
    .agent-label { font-size: 0.72rem; color: #999; }

    /* EMPTY */
    .empty {
      text-align: center;
      padding: 60px 24px;
      color: #999;
      grid-column: 1/-1;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty h3 { font-size: 1.1rem; color: #666; }

    /* LOADING */
    .loading-bar {
      background: #e8f0fe;
      border: 1px solid #c5d5f5;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #0f3460;
      margin-bottom: 16px;
      display: none;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: white;
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      margin: auto;
      overflow: hidden;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-gallery { position: relative; height: 320px; background: #111; }
    .modal-gallery img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-prev { left: 12px; }
    .gallery-next { right: 12px; }
    .gallery-counter {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 10px;
    }
    .modal-body { padding: 24px; }
    .modal-title { font-size: 1.3rem; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .modal-location { color: #888; font-size: 0.9rem; margin-bottom: 16px; }
    .modal-features { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .modal-feature {
      background: #f0f4ff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: #0f3460;
      font-weight: 600;
    }
    .modal-price { font-size: 1.6rem; font-weight: 800; color: #0f3460; margin-bottom: 16px; }
    .modal-desc { font-size: 0.9rem; color: #555; line-height: 1.6; white-space: pre-wrap; }
    .modal-agent {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .modal-agent img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .modal-agent-info h4 { font-size: 0.95rem; font-weight: 700; }
    .modal-agent-info p { font-size: 0.82rem; color: #888; }
    .modal-cta {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn-whatsapp {
      background: #25d366;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-share {
      background: #0f3460;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.4rem; }
      .filters-bar { gap: 8px; }
      .filters-bar select, .filters-bar input { min-width: 110px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="/">
    <span>DPS Imobiliário</span>
  </a>
  <a class="back-btn" href="/">← Início</a>
</header>

<div class="hero">
  <h1>Imóveis Disponíveis</h1>
  <p>Encontre o imóvel ideal com os nossos especialistas</p>
</div>

<div class="filters-bar">
  <div class="filter-group">
    <label>Tipologia</label>
    <select id="filterTipo" onchange="applyFilters()">
      <option value="">Todas</option>
      <option value="T0">T0</option>
      <option value="T1">T1</option>
      <option value="T2">T2</option>
      <option value="T3">T3</option>
      <option value="T4+">T4+</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Distrito</label>
    <select id="filterDistrito" onchange="applyFilters()">
      <option value="">Todos</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Preço máx.</label>
    <select id="filterPreco" onchange="applyFilters()">
      <option value="">Sem limite</option>
      <option value="150000">Até 150.000 €</option>
      <option value="250000">Até 250.000 €</option>
      <option value="350000">Até 350.000 €</option>
      <option value="500000">Até 500.000 €</option>
      <option value="750000">Até 750.000 €</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Pesquisar</label>
    <input type="text" id="searchBox" placeholder="Título, cidade..." oninput="applyFilters()">
  </div>
  <div class="results-count" id="resultsCount"></div>
</div>

<div class="container">
  <div class="loading-bar" id="loadingBar">A actualizar listagem...</div>
  <div class="grid" id="grid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-gallery">
      <img id="modalImg" src="" alt="">
      <button class="gallery-nav gallery-prev" onclick="galleryNav(-1)">‹</button>
      <button class="gallery-nav gallery-next" onclick="galleryNav(1)">›</button>
      <span class="gallery-counter" id="galleryCounter"></span>
    </div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-location" id="modalLocation"></div>
      <div class="modal-features" id="modalFeatures"></div>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-agent" id="modalAgent"></div>
      <div class="modal-cta" id="modalCta"></div>
    </div>
  </div>
</div>

<script>
// Dados pré-renderizados (actualizados automaticamente)
var IMOVEIS_DATA = [];
var currentModal = null;
var galleryIndex = 0;

// Carregar dados da API (actualiza em background)
function loadFromAPI() {
  fetch('https://crm.grupo-dps.com/imoveis-api.php?action=imoveis&status=publicado')
    .then(r => r.json())
    .then(data => {
      if (data.success && data.data && data.data.length > 0) {
        IMOVEIS_DATA = data.data;
        populateDistritoFilter();
        applyFilters();
      }
    })
    .catch(() => {});
}

function populateDistritoFilter() {
  const sel = document.getElementById('filterDistrito');
  const current = sel.value;
  const distritos = [...new Set(IMOVEIS_DATA.map(i => i.distrito).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos</option>';
  distritos.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    if (d === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function applyFilters() {
  const tipo = document.getElementById('filterTipo').value;
  const distrito = document.getElementById('filterDistrito').value;
  const precoMax = parseInt(document.getElementById('filterPreco').value) || 0;
  const search = document.getElementById('searchBox').value.toLowerCase();

  let filtered = IMOVEIS_DATA.filter(i => {
    if (tipo && i.tipologia !== tipo) return false;
    if (distrito && i.distrito !== distrito) return false;
    if (precoMax && parseFloat(i.preco) > precoMax) return false;
    if (search) {
      const text = (i.titulo + ' ' + i.cidade + ' ' + i.distrito).toLowerCase();
      if (!text.includes(search)) return false;
    }
    return true;
  });

  renderGrid(filtered);
  document.getElementById('resultsCount').innerHTML =
    '<strong>' + filtered.length + '</strong> imóve' + (filtered.length === 1 ? 'l' : 'is') + ' encontrado' + (filtered.length === 1 ? '' : 's');
}

function renderGrid(imoveis) {
  const grid = document.getElementById('grid');
  if (imoveis.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">🏠</div><h3>Nenhum imóvel encontrado com esses filtros.</h3></div>';
    return;
  }

  grid.innerHTML = imoveis.map((i, idx) => {
    const foto = i.foto_principal || '';
    const imgHtml = foto
      ? `<img class="card-img" src="${escHtml(foto)}" alt="${escHtml(i.titulo)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      + `<div class="card-img-placeholder" style="display:none">🏠</div>`
      : `<div class="card-img-placeholder">🏠</div>`;

    const quartos = i.quartos ? `🛏 ${i.quartos} quarto${i.quartos != 1 ? 's' : ''}` : '';
    const area = i.area_util ? `📐 ${parseFloat(i.area_util).toFixed(0)} m²` : '';
    const garagem = i.garagem == 1 ? '🚗 Garagem' : '';
    const features = [quartos, area, garagem].filter(Boolean).join('  ');

    const agenteFoto = i.agente_foto_url || '';
    const agenteImg = agenteFoto
      ? `<img class="agent-avatar" src="${escHtml(agenteFoto)}" alt="${escHtml(i.agente_nome)}" onerror="this.style.display='none'">`
      : `<div class="agent-avatar" style="background:#ddd;display:flex;align-items:center;justify-content:center;font-size:1rem">👤</div>`;

    return `<div class="card" onclick="openModal(${idx})">
      <div class="card-wrap">
        ${imgHtml}
        <div class="card-badges">
          <span class="badge tipo">${escHtml(i.tipologia || '')}</span>
          ${i.tipo ? `<span class="badge">${escHtml(i.tipo)}</span>` : ''}
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(i.titulo)}</div>
        <div class="card-location">📍 ${escHtml([i.cidade, i.distrito].filter(Boolean).join(', '))}</div>
        ${features ? `<div class="card-features"><span>${features}</span></div>` : ''}
        <div class="card-price">${escHtml(i.preco_formatado || '')}</div>
      </div>
      <div class="card-agent">
        ${agenteImg}
        <div class="agent-info">
          <span class="agent-name">${escHtml(i.agente_nome || '')}</span>
          <span class="agent-label">Agente DPS</span>
        </div>
      </div>
    </div>`;
  }).join('');

  // Guardar dados filtrados para modal
  window._filteredImoveis = imoveis;
}

function openModal(idx) {
  const imoveis = window._filteredImoveis || IMOVEIS_DATA;
  const i = imoveis[idx];
  if (!i) return;
  currentModal = i;
  galleryIndex = 0;

  const fotos = i.fotos_urls || i.fotos || (i.foto_principal ? [i.foto_principal] : []);
  window._modalFotos = fotos;

  // Imagem
  document.getElementById('modalImg').src = fotos[0] || '';
  document.getElementById('galleryCounter').textContent = fotos.length > 1 ? `1 / ${fotos.length}` : '';

  // Info
  document.getElementById('modalTitle').textContent = i.titulo || '';
  document.getElementById('modalLocation').textContent = '📍 ' + [i.cidade, i.distrito].filter(Boolean).join(', ');
  document.getElementById('modalPrice').textContent = i.preco_formatado || '';

  // Features
  const feats = [];
  if (i.tipologia) feats.push(i.tipologia);
  if (i.quartos) feats.push(`${i.quartos} quarto${i.quartos != 1 ? 's' : ''}`);
  if (i.area_util) feats.push(`${parseFloat(i.area_util).toFixed(0)} m²`);
  if (i.garagem == 1) feats.push('Garagem');
  document.getElementById('modalFeatures').innerHTML = feats.map(f => `<span class="modal-feature">${escHtml(f)}</span>`).join('');

  // Descrição
  document.getElementById('modalDesc').textContent = i.descricao || '';

  // Agente
  const agFoto = i.agente_foto_url || '';
  const agImg = agFoto ? `<img src="${escHtml(agFoto)}" onerror="this.style.display='none'">` : '';
  document.getElementById('modalAgent').innerHTML = `
    ${agImg}
    <div class="modal-agent-info">
      <h4>${escHtml(i.agente_nome || '')}</h4>
      <p>Agente DPS Imobiliário</p>
    </div>`;

  // CTA
  const tel = (i.agente_telefone || '').replace(/\D/g, '');
  const waMsg = encodeURIComponent(`Olá, tenho interesse no imóvel: ${i.titulo}`);
  const waUrl = tel ? `https://wa.me/351${tel}?text=${waMsg}` : `https://wa.me/351910000000?text=${waMsg}`;
  const pageUrl = encodeURIComponent(window.location.href + '?imovel=' + (i.id || ''));
  document.getElementById('modalCta').innerHTML = `
    <a class="btn-whatsapp" href="${waUrl}" target="_blank">💬 Contactar via WhatsApp</a>
    <button class="btn-share" onclick="shareImovel('${escHtml(i.titulo)}')">🔗 Partilhar</button>`;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Actualizar URL
  history.pushState({imovel: i.id}, '', '?imovel=' + (i.id || ''));
}

function galleryNav(dir) {
  const fotos = window._modalFotos || [];
  if (fotos.length <= 1) return;
  galleryIndex = (galleryIndex + dir + fotos.length) % fotos.length;
  document.getElementById('modalImg').src = fotos[galleryIndex];
  document.getElementById('galleryCounter').textContent = `${galleryIndex + 1} / ${fotos.length}`;
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  history.pushState({}, '', window.location.pathname);
}

function shareImovel(titulo) {
  if (navigator.share) {
    navigator.share({ title: titulo, url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => alert('Link copiado!'));
  }
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Inicializar com dados pré-renderizados e depois actualizar via API
window.addEventListener('DOMContentLoaded', function() {
  // Mostrar dados pré-renderizados imediatamente
  if (IMOVEIS_DATA.length > 0) {
    populateDistritoFilter();
    applyFilters();
  }
  // Actualizar em background
  loadFromAPI();
});
</script>

<!-- DADOS PRÉ-RENDERIZADOS (actualizados pelo servidor) -->
